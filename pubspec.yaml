name: apk_koperasi
description: Aplikasi Koperasi Delayota (Flutter + PHP API)
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # STATE MANAGEMENT
  provider: ^6.1.2

  lottie: ^3.3.0


  # HTTP API
  http: ^1.2.1
  flutter_secure_storage: ^9.2.1

  # UI & DESIGN
  google_fonts: ^6.1.0
  cached_network_image: ^3.4.0
  pull_to_refresh: ^2.0.0

  # DATE / UTILS
  intl: ^0.19.0

  # FOR GENERATING XLSX IF NEEDED LATER
  excel: ^2.1.0

  # Flutter Material Icons (optional)
  flutter_launcher_icons: ^0.13.1
  image_picker: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700

    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700

    - family: Nexa
      fonts:
        - asset: assets/fonts/NexaBold.ttf
          weight: 700
